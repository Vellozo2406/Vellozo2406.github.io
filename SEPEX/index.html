<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEPEX</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        header{
            display: flex;
            flex-direction: row;
        }

        ul{
            display: flex;
            flex-direction: row;
            list-style: none;
            justify-content: right;
        }

        li{
            margin: 10px;
        }

        .botao{
            text-decoration: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 15px;
            background-color: rgb(14, 98, 255);
        }

        .botao:hover{
            transform: scale(2);
            transition: 500ms;
            color: #ffe798;
            background-color: rgb(38, 248, 255);
            box-shadow: 5px 5px 10px #888;
        }

        .programacao{
            display: flex;
            justify-content: space-around;
            width: 1000px;
        }

        .conteudo {
            text-align: center;
        }

        .programacao article{
            justify-content: space-around;
            border: 1px solid #000;
            width: 250px;
            box-shadow: 2px 3px 15px #666;
        }

        .programacao article :hover{
            transform: translateY(-5px) scale(1.1);
            box-shadow: 2px 3px 5px #666;
            transition: .5s ease;
        }

        .destaque{
            animation: pulsar .5 ease;
            animation-iteration-count: infinite;
        }

        h1{
            text-align: center;
            animation: titulo 1s ease;
        }

        @keyframes pulsar{ 
            0% {transform: scale(1);}
            50% {transform: scale(1.05);}
            100% {transform: scale(1);}
        }

         @keyframes titulo{ 
            0% {opacity: 0; transform: translateY(-20px);}
            100% {opacity: 1; transform: translateY(0px);}
        }

       nav{
        display
       }
    </style>
</head>
<body>
    <header>
        <h2>Semana de Tecnologia</h2>
        <nav>
            <ul>
                <li> <a href="">Início</a> </li>
                <li> <a href="">Programação</a> </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Semana de Tecnologia</h1>
            <h3>Tecnologia, inovação e criatividade.</h3>
             <a href="" class="botao">Quero participar</a>
        </section>

        <section class="programacao">
            <h1>Programação</h1>
             <article class="card">
                <h3>Palestra</h3>
                <p>Intelogencia artificial</p>
                <span>18:30</span>
            </article>

            <article class="card">
                <h3>Workshop</h3>
                <p></p>
                <span>19:30</span>
            </article>

            <article class="card destaque">
                <h3>Hackathon</h3>
                <p></p>
                <span>20:30</span>
            </article>
        </section>
    </main>

    <footer>
        <h2>Inscrições Abertas</h2>
        <a href="">Inscreva-se</a>
    </footer>
</body>
</html>
